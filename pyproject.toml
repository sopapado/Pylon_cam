[build-system]
requires = ["setuptools>=61,<68; python_version < '3.8'", "setuptools>=68,<77; python_version >= '3.8'", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simplepicam"
version = "0.1.0"
description = "A small synchronous spectrum API for Princeton Instruments PICam cameras"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "GPL-3.0-or-later"}
dependencies = ["numpy>=1.21.6,<1.22; python_version < '3.8'", "numpy>=1.22; python_version >= '3.8'"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.7",
  "Topic :: Scientific/Engineering :: Physics",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE.md"]
